name: Keep the API warm

# Render free instances sleep after ~30 idle minutes and the first request then
# waits out a 50-90s cold start. Pinging the health endpoint keeps it answering.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Hit /api/markets/ping
        run: |
          for attempt in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 \
              https://atg-api-5de3.onrender.com/api/markets/ping || echo 000)
            echo "attempt=$attempt http=$code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "API did not answer 200"
          exit 1
