name: Deploy API to Hostingzim VPS

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Type deploy to publish the API to the production VPS
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm_deploy == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build API JAR
        working-directory: backend
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean bootJar

      - name: Configure SSH for the VPS
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '41.190.35.20 ssh-rsa ' >> ~/.ssh/known_hosts

      - name: Upload the built API JAR
        id: upload
        working-directory: backend
        run: |
          jar=build/libs/atg-api-1.0.0.jar
          test -s "$jar"
          sha256sum "$jar" | awk '{print "sha=" $1}' >> "$GITHUB_OUTPUT"
          scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$jar" atgdeploy@41.190.35.20:/var/lib/atg-deploy/incoming/atg-api-1.0.0.jar.uploading
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            atgdeploy@41.190.35.20 \
            'mv /var/lib/atg-deploy/incoming/atg-api-1.0.0.jar.uploading /var/lib/atg-deploy/incoming/atg-api-1.0.0.jar'

      - name: Wait for deployment and health check
        env:
          EXPECTED_SHA: ${{ steps.upload.outputs.sha }}
        run: |
          for attempt in $(seq 1 60); do
            state=$(ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              atgdeploy@41.190.35.20 'cat /var/lib/atg-deploy/status 2>/dev/null || true')
            echo "deployment state: $state"
            if [ "$state" = "ok $EXPECTED_SHA" ]; then exit 0; fi
            if [ "$state" = "failed $EXPECTED_SHA" ]; then exit 1; fi
            sleep 2
          done
          echo 'Timed out waiting for the VPS deployment watcher.'
          exit 1
