name: iOS build

# Builds the iOS app on a GitHub-hosted macOS runner, so no local Mac is needed.
# The result is an unsigned .ipa: install it on a phone with Sideloadly (Apple ID signing)
# or use codemagic.yaml at the repository root for a signed TestFlight build.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - mobile/**
      - .github/workflows/ios.yml

jobs:
  build-ios:
    name: Build unsigned iOS app
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Install packages
        working-directory: mobile
        run: |
          mkdir -p build/ios/SourcePackages
          flutter pub get

      - name: Analyze and test
        working-directory: mobile
        run: |
          flutter analyze
          flutter test

      - name: Build iOS (unsigned)
        working-directory: mobile
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        working-directory: mobile
        run: |
          mkdir -p build/ios/ipa-unsigned/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa-unsigned/Payload/
          cd build/ios/ipa-unsigned
          zip -qry Runner-unsigned.ipa Payload
          ls -lh Runner-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Runner-unsigned-ipa
          path: mobile/build/ios/ipa-unsigned/Runner-unsigned.ipa
          if-no-files-found: error
