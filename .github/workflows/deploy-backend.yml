name: Deploy backend to Cloud Run

# Builds the Spring Boot backend into a Docker image, pushes it to
# Artifact Registry and deploys it to Cloud Run in the Firebase GCP
# project (atg-app-6908e). The API is public (--allow-unauthenticated) so
# the mobile app can reach it; all data endpoints still require a JWT.
# Requires secrets GCP_SA_KEY (backend/keys/firebase-adminsdk.json) and
# ATG_JWT_SECRET, plus billing enabled on the Firebase project.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - backend/**
      - .github/workflows/deploy-backend.yml

env:
  PROJECT_ID: atg-app-6908e
  REGION: europe-west1
  SERVICE: atg-api
  IMAGE: europe-west1-docker.pkg.dev/atg-app-6908e/atg/atg-api

jobs:
  deploy:
    name: Build and deploy to Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Extract runtime service account email
        run: echo "SA_EMAIL=$(jq -r .client_email <<< '${{ secrets.GCP_SA_KEY }}')" >> "$GITHUB_ENV"

      - name: Enable required GCP APIs
        run: |
          gcloud services enable artifactregistry.googleapis.com run.googleapis.com \
            --project=$PROJECT_ID

      - name: Ensure Artifact Registry repo exists
        run: |
          gcloud artifacts repositories create atg \
            --repository-format=docker \
            --location=$REGION \
            --project=$PROJECT_ID \
            || echo "Repository already exists"

      - name: Configure Docker auth
        run: gcloud auth configure-docker $REGION-docker.pkg.dev

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          flags: >-
            --allow-unauthenticated
            --service-account=${{ env.SA_EMAIL }}
            --set-env-vars=ATG_JWT_SECRET=${{ secrets.ATG_JWT_SECRET }}
            --max-instances=2
            --memory=1Gi

      - name: Point base-url at the live Cloud Run URL
        run: |
          URL=$(gcloud run services describe $SERVICE --region=$REGION --project=$PROJECT_ID \
            --format='value(status.url)')
          gcloud run services update $SERVICE --region=$REGION --project=$PROJECT_ID \
            --update-env-vars=ATG_BASE_URL=$URL
          echo "Live URL: $URL"
