spring.application.name=atg-api
server.port=8080

spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=14MB

app.jwt.secret=atg-accurate-trading-group-dev-secret-key-change-in-production-0123456789
app.jwt.ttl-hours=720
app.upload.dir=./uploads
app.base-url=http://localhost:8080

# Path to the Firebase service account JSON key (from Firebase console >
# Project settings > Service accounts). Leave blank to disable push sending.
# The key file itself lives in backend/keys/ (gitignored, never committed).
# On Cloud Run this is ignored and Application Default Credentials are used.
app.firebase.service-account=keys/firebase-adminsdk.json
