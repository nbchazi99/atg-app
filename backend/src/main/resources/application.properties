spring.application.name=atg-api
server.port=8080

# Default profile uses embedded H2 in PostgreSQL compatibility mode so the API runs
# out of the box. Run with --spring.profiles.active=prod for PostgreSQL.
spring.profiles.active=dev

spring.datasource.url=jdbc:h2:file:./data/atg;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=14MB

app.jwt.secret=atg-accurate-trading-group-dev-secret-key-change-in-production-0123456789
app.jwt.ttl-hours=720
app.upload.dir=./uploads
app.base-url=http://localhost:8080

# Path to the Firebase service account JSON key (from Firebase console >
# Project settings > Service accounts). Leave blank to disable push sending.
# The key file itself lives in backend/keys/ (gitignored, never committed).
app.firebase.service-account=keys/firebase-adminsdk.json
