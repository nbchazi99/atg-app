spring.application.name=atg-api
server.port=8080

spring.servlet.multipart.max-file-size=250MB
spring.servlet.multipart.max-request-size=252MB

app.jwt.secret=atg-accurate-trading-group-dev-secret-key-change-in-production-0123456789
app.jwt.ttl-hours=720
app.upload.dir=./uploads
app.base-url=http://localhost:8080
app.mail.host=${MAIL_HOST:}
app.mail.port=${MAIL_PORT:587}
app.mail.username=${MAIL_USERNAME:}
app.mail.password=${MAIL_PASSWORD:}
app.mail.from=${MAIL_FROM:}
app.mail.smtp-auth=${MAIL_SMTP_AUTH:true}
app.mail.smtp-starttls=${MAIL_SMTP_STARTTLS:true}
app.mail.smtp-ssl=${MAIL_SMTP_SSL:false}

# Path to the Firebase service account JSON key (from Firebase console >
# Project settings > Service accounts). Paste any project's key here and the
# backend targets that project; FIREBASE_SERVICE_ACCOUNT can point elsewhere.
# The key file itself lives in backend/keys/ (gitignored, never committed).
# On Cloud Run this is ignored and Application Default Credentials are used.
app.firebase.service-account=${FIREBASE_SERVICE_ACCOUNT:keys/firebase-adminsdk.json}
# Leave blank to derive the bucket from the key's project_id
# (<project_id>.firebasestorage.app) — see FirebaseProjectProperties.
app.firebase.storage-bucket=${FIREBASE_STORAGE_BUCKET:}

# Dischub payment gateway - non-redirect EcoCash integration (ecocash.md).
# Every value is environment-driven; nothing is hard-coded. There is no test
# mode: orders always go live and push an EcoCash prompt to the customer.
app.dischub.base-url=${DISCHUB_BASE_URL:https://dischub.co.zw}
app.dischub.api-key=${DISCHUB_API_KEY:}
app.dischub.recipient=${DISCHUB_RECIPIENT:}
