# Render blueprint: hosts the ATG Spring Boot API on the free tier.
# Database (Firestore), push (FCM) and app distribution stay on Firebase.
services:
  - type: web
    name: atg-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/settings/public
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: 10000
      - key: ATG_JWT_SECRET
        generateValue: true
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx320m -XX:MaxMetaspaceSize=120m -XX:ReservedCodeCacheSize=48m"
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        value: atg-app-6908e.firebasestorage.app
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_SMTP_AUTH
        value: "true"
      - key: MAIL_SMTP_STARTTLS
        value: "true"
      - key: MAIL_SMTP_SSL
        value: "false"
      # Bootstrap admin for an empty database only; set the values in the Render
      # dashboard so no credential lands in this public repository.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # ATG_BASE_URL defaults to RENDER_EXTERNAL_URL in application-prod.properties.
  - type: web
    name: atg-app-web
    runtime: static
    buildCommand: |
      git clone --depth 1 --branch 3.50.1 https://github.com/flutter/flutter.git /tmp/flutter-sdk
      /tmp/flutter-sdk/bin/flutter config --no-analytics
      cd mobile
      /tmp/flutter-sdk/bin/flutter pub get
      /tmp/flutter-sdk/bin/flutter build web --release --no-pub
    staticPublishPath: ./mobile/build/web
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
